<title>Milton Keynes in the Heat</title>
<style>/*FONT_FACE*/</style>
<style>/*MAPLIBRE_CSS*/</style>
<style>
/* Layout: the city fills the screen; one plain card holds the message, the three views and the hour.
   One grotesque face throughout, in keeping with the new town's modernism. Single light theme on purpose:
   a white basemap, so the heat colours carry the page. */
:root {
  color-scheme: light;
  --ground: #f5f5f3; --paper: #ffffff; --ink: #1c1c1b; --muted: #66645f; --rule: #e2e0dc; --track: #eeece8;
  --heat: #b8361f;
  --c0: #9dbdca; --c1: #f2d58c; --c2: #eea55a; --c3: #c8321f; --c4: #66172a; --grey: #9a968f;
  --d0: #a9c3cc; --under: #4f6470; --d1: #f3cf8f; --d2: #e2803d; --d3: #a8281c;
  --font: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --sheet: 0px;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.4 var(--font); }
#map { position: fixed; inset: 0; background: var(--ground); }
/* read out, not shown */
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.card {
  position: fixed; z-index: 2; left: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); box-sizing: border-box; width: min(458px, calc(50vw + 14px)); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px);
  overflow: auto; background: var(--paper); border: 1px solid var(--rule); border-radius: 2px;
  display: grid; gap: 10px; padding: 14px 18px 12px;
}
.story { display: grid; gap: 8px; }
.when { font-size: 13px; color: var(--muted); }
h1 { margin: 0; font: 600 24px/1.15 var(--font); letter-spacing: -.01em; text-wrap: balance; }
h1 em { font-style: normal; color: var(--heat); }
.deck { margin: 0; color: var(--muted); font-size: 14px; }
.views { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.view {
  appearance: none; text-align: left; cursor: pointer; background: var(--paper); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 2px; padding: 8px 9px 9px; display: grid; gap: 3px; font: inherit;
}
.view:hover { border-color: var(--muted); }
.view[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 -3px 0 var(--ink); }
.view:focus-visible, .scrub:focus-visible, .x:focus-visible, .play:focus-visible, .grip:focus-visible { outline: 2px solid var(--heat); outline-offset: 2px; }
.view b { font-weight: 600; font-size: 13px; line-height: 1.15; }
.view span { font: 600 21px/1 var(--font); font-variant-numeric: tabular-nums; }
.view small { font-size: 12px; color: var(--muted); line-height: 1.2; }
.view small:empty { display: none; }
.vh { margin: 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.vhrow { display: flex; align-items: center; justify-content: space-between; gap: 4px 8px; flex-wrap: wrap; margin-bottom: -4px; }
.mode.where button { font-size: 12px; padding: 5px 8px; }
.day { display: grid; gap: 6px; }
.dayhead { display: flex; align-items: center; gap: 6px; }
.mode { display: inline-grid; grid-auto-flow: column; border: 1px solid var(--rule); border-radius: 2px; }
.mode button { appearance: none; border: 0; background: var(--paper); color: var(--muted); font: 500 13px/1 var(--font); padding: 7px 10px; cursor: pointer; font-variant-numeric: tabular-nums; }
.mode button + button { border-left: 1px solid var(--rule); }
.mode button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.mode button:focus-visible { outline: 2px solid var(--heat); outline-offset: 1px; }
/* the hours played through: a plain triangle, two bars while it plays */
.play { appearance: none; flex: none; width: 29px; height: 29px; padding: 0; display: grid; place-items: center; cursor: pointer; background: var(--paper); color: var(--ink); border: 1px solid var(--rule); border-radius: 2px; }
.play:hover { border-color: var(--muted); }
.play svg { width: 11px; height: 11px; fill: currentColor; }
.play .pa, .play.on .pl { display: none; }
.play.on .pa { display: block; }
.scen { display: grid; gap: 6px; }
.scnote { margin: 0; font-size: 12px; color: var(--muted); }
.air { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.cap { margin: 0; font-size: 12px; line-height: 1.2; color: var(--muted); }
/* a column an hour: its fill the share at 38 °C or more, a line across it the share as it was while a plan shows. The
   slider lies over the columns with nothing of its own drawn and its thumb a column wide (--bw, set by the script), so
   a click or a drag on the columns chooses that column's hour */
.hours { position: relative; height: 44px; }
.bars { display: grid; grid-template-columns: repeat(var(--nh, 14), 1fr); column-gap: 3px; height: 100%; }
.bars i { position: relative; background: var(--track); }
.bars i::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: var(--f, 0%); background: var(--heat); opacity: .5; }
.day.all .bars i::before, .bars i.on::before { opacity: 1; }
.bars i.on { outline: 1.5px solid var(--ink); outline-offset: 1.5px; }
.bars i[data-b]::after { content: ""; position: absolute; left: -1px; right: -1px; bottom: var(--b, 0%); border-top: 1.5px solid var(--ink); }
.scrub { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; appearance: none; -webkit-appearance: none; background: none; cursor: pointer; touch-action: pan-y; }
.scrub::-webkit-slider-runnable-track { height: 100%; background: none; border: 0; }
.scrub::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: var(--bw, 30px); height: 100%; background: none; border: 0; box-shadow: none; }
.scrub::-moz-range-track { height: 100%; background: none; border: 0; }
.scrub::-moz-range-thumb { width: var(--bw, 30px); height: 100%; background: none; border: 0; border-radius: 0; }
.scrub:focus-visible { outline-offset: 3px; }
/* each label at the start of its hour's column */
.ticks { display: grid; grid-template-columns: repeat(var(--nh, 14), 1fr); column-gap: 3px; font-size: 12px; line-height: 1.2; color: var(--muted); font-variant-numeric: tabular-nums; }
.ticks span { white-space: nowrap; border-left: 1px solid var(--rule); padding-left: 3px; margin-left: -1px; }
.key { display: grid; gap: 6px; border-top: 1px solid var(--rule); padding-top: 12px; }
.keyhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.keyhead span { font-size: 12px; color: var(--muted); }
.key h2 { margin: 0; font-weight: 600; font-size: 13px; }
.scale { display: grid; gap: 2px; }
.scale i { height: 10px; display: block; }
.scale span { font-size: 12px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.scale b { font: 600 12px/1.2 var(--font); font-variant-numeric: tabular-nums; }
.scale span.w { color: var(--muted); }
.scale.fine { gap: 0; }
.scale.fine i { height: 12px; }
.scale.fine span { white-space: nowrap; overflow: visible; }
.scale.fine .edge { border-left: 1px solid var(--ink); padding-left: 3px; }
.grey { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.grey i { width: 22px; height: 12px; flex: none; border: 1px solid var(--grey);
  background: repeating-linear-gradient(135deg, var(--grey) 0 1.5px, transparent 1.5px 5px); }
.grey i.u { height: 4px; border: 0; background: var(--under); border-radius: 2px; }
.hint { margin: 0; font-size: 12px; color: var(--muted); }
/* the key on the map, for a phone, where the card's own is out of sight */
.legend { display: none; position: fixed; z-index: 1; left: 10px; top: calc(10px + env(safe-area-inset-top, 0px)); width: min(232px, calc(100vw - 72px)); box-sizing: border-box;
  gap: 4px; padding: 7px 9px 7px; background: rgba(255, 255, 255, .93); border: 1px solid var(--rule); border-radius: 2px; }
.legend b.t { font-weight: 600; font-size: 12px; line-height: 1.2; }
.legend .scale span { font-size: 11.5px; }
.legend .grey { font-size: 11.5px; gap: 6px; }
.legend .grey i { width: 16px; height: 10px; }
.src { margin: 0 0 14px; }
.src p { margin: 0 0 8px; }
.src b { font-weight: 600; }
.maplibregl-ctrl-attrib, .maplibregl-ctrl-attrib a { font: 11px/1.35 var(--font); color: var(--muted); }
.maplibregl-ctrl-scale { font: 12px/1.3 var(--font); color: var(--ink); }
.maplibregl-ctrl-attrib.maplibregl-compact { min-height: 22px; }
.maplibregl-popup-content { font: 13px/1.35 var(--font); color: var(--ink); padding: 12px 14px; border-radius: 2px; box-shadow: 0 2px 10px rgba(28, 28, 27, .18); }
.maplibregl-popup-close-button { width: 28px; height: 28px; font-size: 18px; color: var(--muted); }
.pop h3 { margin: 0 20px 2px 0; font-weight: 600; font-size: 15px; line-height: 1.2; }
.pop p { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
.pop p.rl { margin: 6px 0 2px; font-size: 11.5px; }
.tt { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 1px; min-width: 238px; }
.tt i { height: 16px; display: block; }
.tt i.on { outline: 2px solid var(--ink); outline-offset: -1px; }
.tt span { font-size: 11px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.pop .sum { margin: 8px 0 0; color: var(--ink); font-size: 12.5px; }
.x { justify-self: start; appearance: none; background: none; border: 0; padding: 0; font: 500 12px var(--font); color: var(--muted); text-decoration: underline; cursor: pointer; }
/* how the map was made, with its sources, in a panel over the map: inside the card it overfilled a laptop's screen
   (Jacob, 18 Oct 2026: "perhaps a popup, or some better method please?"); the card keeps the headline and the line
   that explains it */
.links { display: flex; gap: 16px; align-items: baseline; }
.links a.x { color: var(--muted); }
.method a { color: var(--ink); }
.method { border: 1px solid var(--rule); border-radius: 4px; padding: 20px 22px 18px; width: min(560px, calc(100vw - 32px));
  max-height: calc(100% - 64px); overflow: auto; color: var(--ink); background: var(--paper); font: 14px/1.5 var(--font); }
.method::backdrop { background: rgba(28, 28, 27, .35); }
.method h2 { margin: 0 0 10px; font: 600 18px/1.2 var(--font); }
.method .cred { margin: 0 0 14px; font-size: 12px; line-height: 1.4; color: var(--muted); }
.method button { appearance: none; border: 1px solid var(--rule); border-radius: 2px; background: var(--paper); color: var(--ink); font: 500 13px/1 var(--font); padding: 8px 12px; cursor: pointer; }
.method button:focus-visible { outline: 2px solid var(--heat); outline-offset: 2px; }
.grip { display: none; }
.nojs { position: fixed; z-index: 1; right: 16px; bottom: 16px; margin: 0; padding: 8px 12px; background: var(--paper); border: 1px solid var(--rule); font-size: 13px; }
/* a laptop's window is often under 800 px tall (Jacob, 18 Oct 2026: "left sidebar doesn't fit on a regular laptop
   screen") */
@media (min-width: 641px) and (max-height: 860px) {
  h1 { font-size: 22px; }
}
@media (min-width: 641px) and (max-height: 760px) {
  .card { gap: 8px; padding-top: 12px; }
  .story { gap: 6px; }
  h1 { font-size: 21px; }
  .deck { font-size: 13px; line-height: 1.35; }
  .scnote { font-size: 11.5px; line-height: 1.3; }
  .view { padding: 6px 8px 7px; }
  .hours { height: 38px; }
  .key { gap: 4px; padding-top: 8px; }
}
@media (min-width: 641px) and (max-height: 700px) {
  .hint { display: none; }
}
/* a phone: the card is a sheet over the foot of the map that folds down to the three views and the hours (its grip, or
   moving the map, folds it), so the map has most of the screen; the key is on the map (.legend) and the map's own
   corner controls stand clear of the sheet (--sheet, its height, kept by the script) */
@media (max-width: 640px) {
  .card { left: 0; right: 0; top: auto; bottom: 0; width: auto; max-height: 70%; border-width: 1px 0 0; border-radius: 10px 10px 0 0;
    padding: 0 16px calc(10px + env(safe-area-inset-bottom, 0px)); gap: 10px; box-shadow: 0 -1px 10px rgba(28, 28, 27, .1); }
  .grip { display: flex; position: relative; align-items: center; justify-content: center; appearance: none; border: 0; background: none; cursor: pointer;
    margin: 0 -16px -6px; padding: 0 16px; height: 30px; font: 500 12px/1 var(--font); color: var(--muted); }
  .grip i { width: 40px; height: 4px; border-radius: 2px; background: var(--rule); }
  .grip span { position: absolute; top: 10px; }
  .grip #gripp { left: 16px; color: var(--ink); display: none; }
  .card.min .grip #gripp { display: block; }
  .grip #gripl { right: 16px; text-decoration: underline; }
  .card.min .story, .card.min .scen, .card.min .links, .card.min .cap, .card.min .hint { display: none; }
  .card.min { gap: 8px; }
  .key { display: none; }
  .legend { display: grid; }
  h1 { font-size: 20px; }
  .view { padding: 6px 8px 7px; }
  .view span { font-size: 18px; }
  .mode button { padding: 9px 10px; }
  .mode.where button { padding: 8px 9px; }
  .play { width: 33px; height: 33px; }
  .hours { height: 38px; }
  .links { gap: 20px; padding: 2px 0 4px; }
  .x { font-size: 13px; }
  .maplibregl-ctrl-top-right { top: env(safe-area-inset-top, 0px); }
  .maplibregl-ctrl-bottom-right, .maplibregl-ctrl-bottom-left { bottom: var(--sheet); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<!-- data-cfasync: Cloudflare's Rocket Loader, on for the weinbren.me zone, leaves these scripts alone (it rewrote and
     deferred them, and the map's colours read from the page's CSS came back empty, so the map drew nothing) -->
<script data-cfasync="false" src="__MAPLIBRE_JS__"></script>
<script data-cfasync="false" src="__PMTILES_JS__"></script>
<script data-cfasync="false">
(async () => {
const css = getComputedStyle(document.documentElement), tok = k => css.getPropertyValue(k).trim();
// two builds of one page (build.py): 'site', for a host that serves byte ranges, reads every map layer from PMTiles
// (the basemap, the footpaths, stops, greyed areas and new trees as vector tiles, the ground as raster tiles), so a
// visitor fetches only the tiles in view (Jacob, 18 Oct 2026: "serve as much as you can via pmtiles"); 'artifact', for
// claude.ai, which serves no .pmtiles, carries the basemap and the label font as text and the footpaths as JSON.
// Every file is asked for with its own content's hash (V), so it can be kept a year and a new build fetches only what
// changed
const MODE = '__MODE__', SITE = MODE === 'site', V = __VERS__;
const u = p => p + (V[p] ? '?v=' + V[p] : '');
// build.py's compact copy: an hourly value list is one character an hour (value + 35), kept so: the map reads an hour's
// character with a slice, which keeps each footpath to one property a day rather than one an hour (the scenarios' would
// cost a phone seconds to hand to the map); tree positions are steps of 1e-5 degrees
const un = t => Array.from(t, c => c.charCodeAt(0) - 35);
function decode(d) {
  for (const S of Object.values(d.scenarios || {})) {
    if (!S.trees) continue;                           // the site's scenarios hold no trees: they are vector tiles
    const t = S.trees, pts = []; let x = 0, y = 0;
    for (let i = 0; i < t.length; i += 2) { x += t[i]; y += t[i + 1]; pts.push([x / 1e5, y / 1e5]); }
    S.trees = pts;
  }
  return d;
}
const [D, basemap, GLYPHS] = await Promise.all([fetch(u(SITE ? 'meta.json' : 'data_web.json')).then(r => r.json()).then(decode),
  SITE ? null : fetch(u('basemap.txt')).then(r => r.text()).then(t => {   // a plain loop: Uint8Array.from calls its map function once a byte
    const b = atob(t.trim()), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a.buffer; }),
  SITE ? null : fetch(u('glyphs.json')).then(r => r.json())]);
const COLS = D.colors.map(c => c.startsWith('--') ? tok(c) : c), NH = D.hours.length, VIEWS = ['ground', 'paths', 'stops'];
const NAME = { ground: 'Open ground', paths: 'Footpaths', stops: 'Bus stops' };
// the page opens on open ground (Jacob, 19 Oct 2026: "open the heat map, by default, on "open ground" not "footpaths". it
// is visually clearer")
let view = 'ground', hi = D.start, mode = 'day', pop = null, ready = false;
// the alternative Thursdays (package.py --scenario NAME, one entry each): their own values, figures and images
const SCS = D.scenarios || {}; let scen = '';
const SC = () => scen ? SCS[scen] : null;
// where the figures are of (Jacob, 19 Oct 2026: "split the figures between the urban core and the greater extent"):
// the urban part, where most people live, first; the map shows the whole area either way, the rest of it paled while
// the urban part's figures show (the mask below)
let where = D.urban ? 'urban' : '';
const FIG = () => { const F = scen ? SCS[scen] : D; return where && F.urban ? F.urban : F; };
const ST = () => FIG().stats, DST = () => FIG().day_stats || D.day.stats;
const NSTOPS = () => where ? D.urban.n_stops : D.n_stops;
// a scenario holds only the pieces and stops it changes ({index: values}); the first pass's values stand elsewhere
const pathVals = (i, s = scen) => un((s && SCS[s].paths[i]) || D.paths[i][1]), stopVals = (i, s = scen) => un((s && SCS[s].stops[i]) || D.stops[i].v);
const DCOLS = D.day.colors.map(tok), HOT = D.classes[D.hot].lo;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
// text from the data, written into the page's HTML
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// the page's state in its address, so a view can be sent to someone (9 Nov 2026):
// #v=paths&p=trees&h=14&a=all&m=14.20/52.0406/-0.7594 is the footpaths, the plan "trees", the hour from 14:00, the whole
// borough's figures, and the map's zoom and middle. What is as the page opens is left out, so the plain address stays
// plain. The site's only: the artifact has no address of its own
function readHash() {
  const q = new URLSearchParams(location.hash.slice(1)), o = {};

    const dy = b.top < c.top + 8 ? b.top - c.top - 8 : b.bottom > c.bottom - 8 ? b.bottom - c.bottom + 8 : 0;
    if (dx || dy) map.panBy([dx, dy], { duration: REDUCED ? 0 : 250 });
  });
}
// a clicked feature's day, as it is shown or as it was: the site's from the tile's own properties, the artifact's from
// the JSON by index
const valsOf = (f, kind, s = scen) => SITE ? un(f.properties[s && f.properties['v_' + s] ? 'v_' + s : 'v'])
  : (kind === 'stops' ? stopVals : pathVals)(f.properties.i, s);
map.on('click', 'stops', ev => {
  if (view !== 'stops') return;
  const f = ev.features[0], st = SITE ? { ...f.properties, x: f.geometry.coordinates[0], y: f.geometry.coordinates[1] } : D.stops[f.properties.i];
  openPop([st.x, st.y], () => st.g === 2 ? `<div class="pop"><h3>${esc(st.n)}</h3><p>${esc(st.m)}</p><p class="sum">Under a canopy or overhang, so in shade all day. The lidar cannot see under it, so it is not modelled.</p></div>`
    : st.g ? notModelled(st.n) : timetable(valsOf(f, 'stops'), st.n, st.m + (st.sh ? ' · has a shelter' : ''), scen ? valsOf(f, 'stops', '') : null),
    { type: 'Point', coordinates: [st.x, st.y] });
});
map.on('click', 'paths-case', ev => {
  if (view !== 'paths') return;
  const f = ev.features[0], g = SITE ? f.properties.g : D.paths[f.properties.i][2];
  openPop(ev.lngLat, () => g === 2 ? `<div class="pop"><h3>Underpass or covered path</h3><p class="sum">Under a bridge or roof, so in shade all day. The lidar cannot see under it, so it is not modelled.</p></div>`
    : g ? notModelled('Footpath') : timetable(valsOf(f, 'paths'), 'This stretch of path', 'Up to 25 m of path', scen ? valsOf(f, 'paths', '') : null),
    f.geometry.type === 'LineString' ? f.geometry : null);
});
[['stops', 'stops'], ['paths', 'paths-case']].forEach(([v, l]) => {
  map.on('mouseenter', l, () => { if (view === v) map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', l, () => { map.getCanvas().style.cursor = ''; });
});
// the phone's sheet (the CSS): its grip folds it to the views and the hours and unfolds it, a swipe on the grip does
// the same, and it folds when the reader takes hold of the map
const grip = document.getElementById('grip');
function fold(min, byGrip) {
  if (cardEl.classList.contains('min') === min) return;
  cardEl.classList.toggle('min', min); grip.setAttribute('aria-expanded', !min); put('gripl', min ? 'More' : 'Less');
  if (byGrip && ready && autoView) fitArea(true);    // the area in the room the sheet now leaves
}
grip.onclick = () => fold(!cardEl.classList.contains('min'), true);
let gy = null;
grip.addEventListener('touchstart', ev => { gy = ev.touches[0].clientY; }, { passive: true });
grip.addEventListener('touchend', ev => { const dy = ev.changedTouches[0].clientY - gy; gy = null; if (Math.abs(dy) > 24) { fold(dy > 0, true); ev.preventDefault(); } });
// the sheet's height, for the map's corner controls to stand clear of it
const sheet = () => document.documentElement.style.setProperty('--sheet', phone.matches ? cardEl.offsetHeight + 'px' : '0px');
new ResizeObserver(() => { sheet(); sizeBars(); }).observe(cardEl);
map.on('movestart', ev => {
  if (!ev.originalEvent) return;                       // the page's own moves (a fit, a popup brought into view) are not the reader's
  autoView = false; if (phone.matches) fold(true);
});
map.on('moveend', () => { if (!autoView) writeHash(); });
// the controls work before the map has loaded (the card is drawn first); the map takes their state when it has
sizeBars(); sheet(); render();
window.mkmap = map;                          // for timing the page's interactions from outside (tests only read it)
window.mkstate = () => ({ view, scen, where, mode, hour: hi, auto: autoView, busy: busy() });
map.on('load', () => {
  ready = true; setView(view); showWhere(); showTrees(); makeHours(); render();
  if (SITE) map.on('render', swapGround);
  map.on('render', swapHours);
  document.querySelector('.maplibregl-ctrl-attrib')?.classList.remove('maplibregl-compact-show');   // credits fold behind the (i)
});
})().catch(err => { document.getElementById('h1').textContent = 'The map could not load. Reload the page to try again.'; console.error(err); });
</script>
